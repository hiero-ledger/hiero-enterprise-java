# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Check code formatting with Spotless
        run: ./mvnw spotless:check

      - name: Prepare Hiero Solo
        id: solo
        uses: hiero-ledger/hiero-solo-action@bdae0a37df52190b6b3801c1c981c0ed37f4616e # v0.23.0
        with:
          installMirrorNode: true

      - name: Wait for Mirror Node
        run: |
          echo "Waiting for Mirror Node REST (Node.js) on http://localhost:38081..."
          until curl --output /dev/null --silent --fail http://localhost:38081/health/readiness; do
            echo "Mirror Node (rest) not ready, waiting..."
            kubectl get svc -n solo || true
            curl --silent http://localhost:38081/health/readiness || echo "No response from mirrorNode REST readiness"
            sleep 5
          done
          echo "Waiting for Mirror Node REST-Java on http://localhost:8084..."
          until curl --output /dev/null --silent --fail http://localhost:8084/actuator/health/readiness; do
            echo "Mirror Node (rest-java) not ready, waiting..."
            curl --silent http://localhost:8084/actuator/health/readiness || echo "No response from REST-Java readiness"
            sleep 5
          done
          echo "Mirror Node APIs are ready!"

      - name: Build with Maven
        env:
          SPRING_PROFILES_ACTIVE: solo
          HEDERA_ACCOUNT_ID: ${{ steps.solo.outputs.accountId }}
          HEDERA_PRIVATE_KEY: ${{ steps.solo.outputs.privateKey }}
          HEDERA_NETWORK: hiero-solo-action
        run: ./mvnw verify
